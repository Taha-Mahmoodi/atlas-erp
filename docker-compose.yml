services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    # Context is the repo root: the image ships /industry-templates too (see Dockerfile).
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ATLAS_DATABASE_URL: postgresql+asyncpg://atlas:atlas@db:5432/atlas
      # Demo default only — set a real secret in the environment for anything public.
      ATLAS_JWT_SECRET: ${ATLAS_JWT_SECRET:-insecure-demo-secret-change-me}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      # slim image has no curl — probe the health endpoint with stdlib urllib.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health').status==200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot demo seed: waits for the API to be healthy, then bootstraps the acme tenant +
  # superuser and populates every module. Opt-in via ATLAS_SEED_DEMO (default 1 here);
  # seed.py refuses to run against a prod DB unless ATLAS_SEED_DEMO=force. Runs once and exits.
  seed:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ATLAS_DATABASE_URL: postgresql+asyncpg://atlas:atlas@db:5432/atlas
      ATLAS_JWT_SECRET: ${ATLAS_JWT_SECRET:-insecure-demo-secret-change-me}
      ATLAS_API: http://backend:8000/api/v1
      ATLAS_SEED_DEMO: ${ATLAS_SEED_DEMO:-1}
    depends_on:
      backend:
        condition: service_healthy
    command: python seed.py
    restart: "no"

  # Built SPA behind nginx, which also proxies /api to the backend so the app and the
  # API share one origin (see frontend/nginx.conf). Open http://localhost:5173.
  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD", "wget", "-qO/dev/null", "http://localhost/"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
