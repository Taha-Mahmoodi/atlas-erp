services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    environment:
      ATLAS_DATABASE_URL: postgresql+asyncpg://atlas:atlas@db:5432/atlas
      # Demo default only — set a real secret in the environment for anything public.
      ATLAS_JWT_SECRET: ${ATLAS_JWT_SECRET:-insecure-demo-secret-change-me}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # frontend service arrives in Phase 15 (frontend design system + module UIs).

volumes:
  pgdata:
