name: Feature request
description: Propose a capability or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What can't be done today, and who needs it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed capability
      description: What it should do. Reference the S/4HANA counterpart if one exists — Atlas scope is benchmark-driven (see docs/research/s4hana-parity.md).
    validations:
      required: true
  - type: input
    id: module
    attributes:
      label: Owning module
      description: finance / inventory / procurement / sales / manufacturing / quality / maintenance / hr / projects / crm / reporting / admin / industry / core / frontend
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Bullet list of verifiable outcomes, including the invariants/tests that should exist.
    validations:
      required: false
