name: Bug report
description: Something behaves differently than specified or expected
labels: ["bug"]
body:
  - type: textarea
    id: whats-wrong
    attributes:
      label: What's wrong
      description: Observed behavior vs. expected, with the exact file/function or endpoint.
      placeholder: "POST /api/v1/finance/journal-entries accepts lines where debit and credit are both zero; service/journal.py:post_journal_entry should reject them."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The failing input, test, or scenario.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Which invariant or feature this threatens (financial integrity, tenant isolation, stock accuracy, auth…).
    validations:
      required: true
  - type: textarea
    id: proposed-fix
    attributes:
      label: Proposed fix
      description: Initial plan, 1–3 lines.
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        Maintainers: add `module:*` and `severity:*` labels (+ `found-during-build` if applicable). Severity rules are in GITHUB-WORKFLOW.md §6.
