<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d" font-family="ui-monospace, &#34;SF Mono&#34;, &#34;DejaVu Sans Mono&#34;, Menlo, monospace">
<title id="t">Atlas ERP — a posted journal entry that balances.</title>
<desc id="d">A ledger-paper document. Header: ATLAS ERP, open-source industry-agnostic ERP; document v1.3.0, posted 2026-08-19. A double-entry journal: account 1000, S/4HANA capabilities benchmarked, debit 140; account 2000, delivered at full parity, credit 44; account 2100, delivered in reduced form, credit 49; account 2200, out of scope with a documented path, credit 47 in amber ink. Totals 140 and 140 — the entry balances. A claret POSTED stamp sits beside the totals. Along the bottom margin, seven hand-pressed fact stamps: licence Apache-2.0; engines PostgreSQL 16 and SQLite; tests 2,334 collected; modules 14 plus core; tables 132; migrations 53; decisions 82.</desc>
<style>
.f{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
@media (prefers-reduced-motion: no-preference){
  .rule-draw{stroke-dasharray:880;stroke-dashoffset:880;animation:draw .78s cubic-bezier(.22,.61,.36,1) .3s forwards}
  .rule-draw2{stroke-dasharray:290;stroke-dashoffset:290;animation:draw .5s cubic-bezier(.22,.61,.36,1) 1.32s forwards}
  .tot{opacity:0;animation:ink .55s ease-out 1.02s forwards}
  .press{opacity:0;animation:press .5s cubic-bezier(.2,.9,.3,1) 1.6s forwards}
}
@media (prefers-reduced-motion: reduce){
  .rule-draw,.rule-draw2,.tot,.press{animation:none !important;stroke-dashoffset:0 !important;opacity:1 !important;transform:none !important}
}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes ink{from{opacity:0}to{opacity:1}}
@keyframes press{0%{opacity:0;transform:translateY(-2.4px)}65%{opacity:1;transform:translateY(.9px)}100%{opacity:1;transform:translateY(0)}}
</style>
