<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 394" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Atlas ERP document flow: one sale traced from quote to journal entry.</title>
  <desc id="dsc">Six paper slips on a ruled line, left to right: QUOTE (QUO-2026-00001, sales.quote), ORDER (SO-2026-00001, sales.order), DELIVERY (DN-2026-00001, sales.delivery), BILLING (BIL-2026-00001, sales.billing), AR INVOICE (INV-2026-00001, finance.customer_invoice) and JOURNAL ENTRY (JE-2026-00001, finance.journal_entry, drawn in claret). Arrows between them carry the core_doc_links link type and the mechanism that writes it: converted_to via source_quote_id, delivered_by via sales_order_id, invoiced_by via delivery_line_id, invoiced_by_invoice via the domain event sales.BillingInvoiced (published, not imported, across the dashed sales/finance module boundary), and posts via journal_entry_id. A dotted arc above the slips shows the extra edge billed_by, linking the order straight to the billing.</desc>
  <style>
  text{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, "DejaVu Sans Mono", monospace}
  .ln{stroke-dasharray:34;stroke-dashoffset:0}
  @keyframes ink{from{opacity:0}to{opacity:1}}
  @keyframes stamp{from{opacity:0;transform:translateY(-2.5px)}to{opacity:1;transform:translateY(0)}}
  @keyframes draw{from{stroke-dashoffset:34}to{stroke-dashoffset:0}}
  .s0{animation:ink .40s ease-out both;animation-delay:0.20s}
  .n0{animation:stamp .34s ease-out both;animation-delay:0.38s}
  .s1{animation:ink .40s ease-out both;animation-delay:0.90s}
  .n1{animation:stamp .34s ease-out both;animation-delay:1.08s}
  .s2{animation:ink .40s ease-out both;animation-delay:1.60s}
  .n2{animation:stamp .34s ease-out both;animation-delay:1.78s}
  .s3{animation:ink .40s ease-out both;animation-delay:2.30s}
  .n3{animation:stamp .34s ease-out both;animation-delay:2.48s}
  .s4{animation:ink .40s ease-out both;animation-delay:3.00s}
  .n4{animation:stamp .34s ease-out both;animation-delay:3.18s}
  .s5{animation:ink .40s ease-out both;animation-delay:3.70s}
  .n5{animation:stamp .34s ease-out both;animation-delay:3.88s}
  .l0{animation:draw .30s linear both;animation-delay:0.60s}
  .h0{animation:ink .18s linear both;animation-delay:0.84s}
  .l1{animation:draw .30s linear both;animation-delay:1.30s}
  .h1{animation:ink .18s linear both;animation-delay:1.54s}
  .l2{animation:draw .30s linear both;animation-delay:2.00s}
  .h2{animation:ink .18s linear both;animation-delay:2.24s}
  .l3{animation:draw .30s linear both;animation-delay:2.70s}
  .h3{animation:ink .18s linear both;animation-delay:2.94s}
  .l4{animation:draw .30s linear both;animation-delay:3.40s}
  .h4{animation:ink .18s linear both;animation-delay:3.64s}
  .arc{animation:ink .55s ease-out both;animation-delay:4.45s}
  @media (prefers-reduced-motion: reduce){.anim{animation:none !important}}
  </style>
  <rect width="1050" height="394" fill="#fbf7f0"/>
  <text x="27" y="26" font-size="10" fill="#6d635a" text-anchor="start" letter-spacing="1.6">ATLAS ERP · DOCUMENT FLOW</text>
  <text x="1023" y="26" font-size="10" fill="#6d635a" text-anchor="end">core_documents · core_doc_links · D-012</text>
  <text x="27" y="58" font-size="19" fill="#241f1a" text-anchor="start" font-weight="600">Trace it back.</text>
  <text x="27" y="80" font-size="10.5" fill="#6d635a" text-anchor="start">One sale crossing two modules. Every document registers itself in core_documents and records its predecessor in core_doc_links.</text>
  <text x="27" y="95" font-size="10.5" fill="#6d635a" text-anchor="start">Each claims its own gapless number. The chain ends in the journal entry, where a business action becomes a financial fact.</text>
