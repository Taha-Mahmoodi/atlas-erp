[project]
name = "atlas-backend"
version = "0.1.0"
description = "Atlas ERP backend (FastAPI + SQLAlchemy 2.0 async, PostgreSQL-first, SQLite-compatible)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite",
    "asyncpg",
    "alembic",
    "pydantic>=2",
    "pydantic-settings",
    "greenlet",
    "pyjwt>=2.13.0",
    "argon2-cffi>=25.1.0",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# The local alembic/ migrations directory must not shadow the installed package
# in import classification.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    # Runs only against a real PostgreSQL (ATLAS_DATABASE_URL must point at it).
    # The SQLite job runs `-m "not pg and not perf"`; the Postgres CI step runs `-m pg` (D-022).
    "pg: requires a PostgreSQL database; skipped on the SQLite test engine",
    # PERFORMANCE §5 wall-clock budget smoke (PLAN 4P.7): excluded from default runs,
    # executed by the non-blocking `perf-smoke` CI job (SQLite, 2x budgets) and locally
    # against Postgres before each promotion (`make perf` + ATLAS_PERF_DATABASE_URL).
    "perf: wall-clock perf budgets over the bulk-seeded mid-volume tenant",
]
filterwarnings = [
    "error::DeprecationWarning:app",
    # The test JWT secret is intentionally the short .env.example placeholder; the
    # >=64-byte requirement (D-008) is a deployment concern, not a test one.
    "ignore::jwt.warnings.InsecureKeyLengthWarning",
]
