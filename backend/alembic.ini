# Alembic configuration for Atlas ERP (D-022: one linear chain, both engines).

[alembic]
# %(here)s = directory of this file, so programmatic runs work from any cwd.
script_location = %(here)s/alembic

# Revision filenames follow STRUCTURE.md: NNNN_short_description
# (pass --rev-id NNNN to `alembic revision` to keep the sequence).
file_template = %%(rev)s_%%(slug)s

prepend_sys_path = .
path_separator = os

# Fallback URL only; env.py prefers config.attributes["sqlalchemy_url"], then
# the ATLAS_DATABASE_URL environment variable.
sqlalchemy.url = sqlite+aiosqlite:///./atlas.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
