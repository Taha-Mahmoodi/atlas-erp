# Serves the built SPA and proxies /api to the backend service, so the app and the
# API share one origin (the refresh cookie is same-origin, scoped to /api/v1/auth).
server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: every non-file route is handled by the client router.
    location / {
        try_files $uri /index.html;
    }
}
