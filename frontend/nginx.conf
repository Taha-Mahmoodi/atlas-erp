# Serves the built SPA and proxies /api to the backend service, so the app and the
# API share one origin (the refresh cookie is same-origin, scoped to /api/v1/auth).

# Rate limit per credential, not per IP: a property's website is one server, so every
# request shares a source address and an IP limit would either throttle the whole
# property or nothing at all. 10 r/s with burst 20 sits between Cloudbeds' 5 r/s per
# property and Toast's 20 r/s burst. nginx does not account requests whose key is
# empty, so unauthenticated calls (login, refresh, health) are deliberately unlimited
# here — a login throttle is a different key and a different decision.
limit_req_zone $http_authorization zone=atlas_api:10m rate=10r/s;

server {
    # BOTH stacks. `localhost` inside the container resolves to ::1 first, so an IPv4-only listen
    # made the compose healthcheck connect to an address nginx never bound — the web tier reported
    # unhealthy forever while serving fine (#217). It is also what any dual-stack host expects.
    listen 80;
    listen [::]:80;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        limit_req zone=atlas_api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: every non-file route is handled by the client router.
    location / {
        try_files $uri /index.html;
    }
}
